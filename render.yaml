# Render Blueprint: one free web service + one free Postgres.
# Render dashboard → New → Blueprint → pick this repo. Check Render's current free-tier terms
# (free Postgres instances may expire; free web services sleep when idle).
services:
  - type: web
    name: booklore
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run db:prepare && npm run build
    startCommand: npm start
    healthCheckPath: /about
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: booklore-db
          property: connectionString
databases:
  - name: booklore-db
    plan: free
    databaseName: booklore
